[project]
name = "wordle-solver"
version = "0.1.0"
description = "Solving Wordle with information theory."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "black>=24.10.0",
    "ruff>=0.8.4",
    "pylint>=3.3.2",
    "flake8>=7.1.1",
    "flake8-pyproject>=1.2.3",
    "mypy>=1.13.0",
    "complexipy>=1.2.0",
    "isort>=5.13.2",
    "bandit>=1.9.4",
    "numpy>=2.4.4",
    "matplotlib>=3.10.9",
    "ipykernel>=7.2.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[[tool.mypy.overrides]]
module = ["numpy.*"]
ignore_missing_imports = true

[tool.flake8]
max-line-length = 88
ignore = ["E203", "W293"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--cov src"

[tool.coverage.run]
omit = ["src/main.py"]

[tool.isort]
profile = "black"
lines_after_imports = 2
